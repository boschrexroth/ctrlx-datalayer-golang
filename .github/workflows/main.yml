name: Make Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Run check
      run: |
        uname -a
        ls -lah
        sudo apt-get update
        sudo apt-get install -y libsystemd-dev
        sudo apt install pkg-config
        wget https://github.com/boschrexroth/ctrlx-automation-sdk/releases/download/4.6.0/ctrlx-datalayer-3.5.2.deb
        sudo apt-get install -y -f ./ctrlx-datalayer-3.5.2.deb

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25
        
    - name: Run go test
      run: |
        ls -lah
        go mod download
        go mod vendor
        go mod tidy
        go test -race -short -count=1 -mod=vendor ./test/datalayer ./test/sseclient ./test/token

